name: Direct Backend Deploy to EC2 Minikube

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Build & Rollout on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export PATH=$PATH:/usr/local/bin:/snap/bin
            cd ~/yesen-crm-backend
            git reset --hard origin/main
            git pull origin main
            docker build -t yesen-crm-backend:latest .
            minikube image load yesen-crm-backend:latest
            kubectl rollout restart deployment/backend-deployment -n yesen-crm
            kubectl rollout status deployment/backend-deployment -n yesen-crm --timeout=120s
